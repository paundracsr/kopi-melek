<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
☕ Dashboard Keuangan Kopi Melek 24 Jam
</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}



body{

background:#eef3f8;
padding:20px;

}



.dashboard-wrapper{

max-width:1400px;
margin:auto;
background:white;
padding:30px;
border-radius:25px;
box-shadow:0 10px 35px rgba(0,0,0,.08);

}




.header{

display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;

border-bottom:2px solid #edf2f7;
padding-bottom:20px;
margin-bottom:25px;

}



.header h1{

font-size:30px;
color:#1e293b;

}



.badge{

margin-top:8px;
display:inline-block;

padding:8px 15px;

background:#1e293b;
color:white;

border-radius:50px;

font-size:13px;

}



button{

border:none;
cursor:pointer;

padding:10px 18px;

border-radius:30px;

font-weight:bold;

}



.btn{

background:#f1f5f9;

}



.btn-primary{

background:#1e293b;

color:white;

}



.summary{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:18px;

margin-bottom:25px;

}



.summary-card{

background:#f8fafc;

padding:20px;

border-radius:20px;

}



.summary-card span{

color:#64748b;

font-size:13px;

font-weight:bold;

}



.summary-card h2{

margin-top:10px;

font-size:25px;

}



.red{

color:#dc2626;

}


.green{

color:#15803d;

}



.chart-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:25px;

}




.card{

background:white;

border:1px solid #e5e7eb;

border-radius:20px;

padding:20px;

}



.card h3{

margin-bottom:15px;

color:#334155;

}




table{

width:100%;
border-collapse:collapse;

}



.table-scroll{

overflow-x:auto;

}



th{

background:#edf3fa;

padding:12px;

}



td{

padding:10px;

text-align:center;

border-bottom:1px solid #ddd;

}



.total-row{

font-weight:bold;

background:#f8fafc;

}



@media(max-width:800px){

.chart-grid{

grid-template-columns:1fr;

}


.dashboard-wrapper{

padding:15px;

}

.header h1{

font-size:22px;

}

}


</style>


</head>


<body>


<div class="dashboard-wrapper" id="dashboard">


<div class="header">


<div>

<h1>
☕ Kopi Melek 24 Jam
</h1>


<div class="badge">
Cash Flow & Laporan Keuangan
</div>


</div>



<div>


<button class="btn"
onclick="saveImage()">

🖼 Gambar

</button>


<button class="btn-primary"
onclick="window.print()">

📄 PDF

</button>


</div>


</div>
<!-- SUMMARY -->

<div class="summary">


<div class="summary-card">

<span>
Total Pengeluaran
</span>

<h2 id="totalPengeluaran" class="red">
Rp0
</h2>

</div>



<div class="summary-card">

<span>
Total Investasi
</span>

<h2 id="totalInvestasi">
Rp0
</h2>

</div>



<div class="summary-card">

<span>
Total Produk F&B
</span>

<h2 id="jumlahProduk">
0
</h2>

</div>



<div class="summary-card">

<span>
Harga Customer
</span>

<h2 class="green">
Rp8.000 - Rp15.000
</h2>

</div>



</div>





<!-- CHART -->

<div class="chart-grid">


<div class="card">

<h3>
📊 Komposisi Cash Flow
</h3>

<canvas id="chartPie"></canvas>

</div>




<div class="card">

<h3>
📈 Investasi Terbesar
</h3>

<canvas id="chartBar"></canvas>

</div>



</div>





<!-- TABLE -->


<div class="card">


<h3>
📋 Detail Pengeluaran Kopi Melek 24 Jam
</h3>


<div class="table-scroll">


<table>


<thead>

<tr>

<th>No</th>

<th>Nama</th>

<th>Qty</th>

<th>Total</th>

</tr>

</thead>



<tbody id="dataTable">

</tbody>



<tfoot>

<tr class="total-row">

<td colspan="3">
TOTAL
</td>


<td id="totalTable">
Rp0
</td>


</tr>


</tfoot>


</table>


</div>


</div>



</div>





<script>


let laporanData;


let pieChart;

let barChart;





function rupiah(angka){

return "Rp " + angka.toLocaleString("id-ID");

}





// LOAD JSON


fetch("data.json")

.then(res=>res.json())

.then(data=>{


laporanData=data;


renderDashboard();


})

.catch(err=>{


console.error(err);


alert(
"data.json tidak ditemukan"
);


});








function renderDashboard(){


const data =
laporanData.months[0];





// SUMMARY


document.getElementById(
"totalPengeluaran"
).innerHTML =
rupiah(
data.summary.totalPengeluaran
);




document.getElementById(
"totalInvestasi"
).innerHTML =
rupiah(
data.summary.totalInvestasi
);




document.getElementById(
"jumlahProduk"
).innerHTML =
data.summary.totalProduk
+
" Item";






// TABLE


let tbody =
document.getElementById(
"dataTable"
);



tbody.innerHTML="";



let total=0;

let no=1;



let semuaData=[


...data.cashflow.stokFNB,


...data.cashflow.investasi


];






semuaData.forEach(item=>{


let subtotal =
item.harga *
(item.qty ?? 1);



total += subtotal;



tbody.innerHTML += `


<tr>


<td>
${no++}
</td>


<td>
${item.nama}
</td>


<td>
${item.qty ?? "-"}
</td>


<td>
${rupiah(subtotal)}
</td>


</tr>


`;


});




document.getElementById(
"totalTable"
).innerHTML =
rupiah(total);




buatChart(data);


}









function buatChart(data){



if(pieChart)
pieChart.destroy();


if(barChart)
barChart.destroy();







// PIE CHART


pieChart = new Chart(

document.getElementById(
"chartPie"
),

{


type:"doughnut",


data:{


labels:[

"Stok F&B",

"Investasi"

],



datasets:[{


data:[


data.summary.totalStok,


data.summary.totalInvestasi


]


}]


},


options:{


responsive:true,


plugins:{


legend:{


position:"bottom"


}


}


}


}


);









// BAR CHART INVESTASI



let investasi=[


...data.cashflow.investasi


]


.sort(
(a,b)=>
b.harga-a.harga
)


.slice(0,8);







barChart=new Chart(


document.getElementById(
"chartBar"
),


{


type:"bar",



data:{


labels:

investasi.map(
x=>x.nama
),



datasets:[{


label:"Rupiah",


data:

investasi.map(
x=>x.harga
)


}]


},




options:{


indexAxis:"y",


responsive:true,


plugins:{


legend:{


display:false


}


}


}


}



);



}









async function saveImage(){



const area =
document.getElementById(
"dashboard"
);



const canvas =
await html2canvas(

area,

{


scale:2,


backgroundColor:"#ffffff"


}

);





const link =
document.createElement(
"a"
);



link.download =
"Dashboard_Kopi_Melek_24_Jam.png";



link.href =
canvas.toDataURL(
"image/png"
);



link.click();


}



</script>



</body>

</html>
