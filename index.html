
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wes Longor Kakean Reken</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #080808;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background:
                radial-gradient(circle at center,
                #292929 0%, #111111 45%, #000000 100%);
        }

        h1 {
            color: #ff2020;
            font-size: clamp(2.5rem, 10vw, 8rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -3px;
            text-transform: uppercase;
            text-shadow:
                4px 4px 0 #650000,
                0 0 25px rgba(255, 0, 0, 0.5);
            animation: kedip 2s ease-in-out infinite alternate;
        }

        p {
            margin-top: 30px;
            color: #eeeeee;
            font-size: clamp(1rem, 3vw, 1.5rem);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .garis {
            width: 100px;
            height: 5px;
            margin-top: 25px;
            background: #ff2020;
            border-radius: 10px;
        }

        @keyframes kedip {
            from {
                transform: scale(1);
                text-shadow: 4px 4px 0 #650000,
                             0 0 15px rgba(255, 0, 0, 0.3);
            }

            to {
                transform: scale(1.04);
                text-shadow: 4px 4px 0 #650000,
                             0 0 35px rgba(255, 0, 0, 0.8);
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>
            WES<br>
            LONGOR<br>
            KAKEAN<br>
            REKEN
        </h1>

        <div class="garis"></div>

        <p>Ojo kakean omong, rek!</p>
    </main>
</body>
</html>
